# ---------------------------------------------------------------------------------------------
# KIPP workflow — INSTALLED 2026-08-03. This file is the live job, not a template.
#
# It began life as `.agents/scheduled-content-ops.workflow.yml`, deliberately outside
# .github/workflows/ so that installing a scheduled job holding service-role database credentials
# and a cross-repo PAT was a decision made on purpose rather than a side effect of an agent
# session. That copy is deleted: there is one file, and it cannot drift from itself.
#
# The secrets checklist it was gated on lives in .agents/scheduled-content-ops.md. Until every
# required secret exists the run is inert rather than broken.
# ---------------------------------------------------------------------------------------------

name: KIPP — Content Ops & Search (agent-co)

# Runs Claude Code (Opus 5) headless in the cloud on a schedule — no local machine needed.
# It executes .agents/scheduled-content-ops.prompt.md: audit the public surface -> fix what is
# broken or untrue -> open PRs -> draft the changelog -> hand Connor an ammo pack -> post to
# Slack -> write the shared employee brain.
#
# It degrades gracefully: without Search Console credentials it still runs and still reports,
# it just cannot see search demand.

on:
  # GitHub Actions cron is UTC and is BEST-EFFORT: runs are frequently delayed 10-45 min and can
  # be dropped entirely under load. There is deliberately NO hour-guard — a self-rejecting guard
  # is what killed every scheduled run on the product side once already (a delayed run landed
  # outside its target hour, exited in seconds, and posted nothing). A delayed run still runs and
  # still notifies.
  #
  # Weekly, Friday. A changelog is a weekly artifact and daily marketing is noise; unlike TARS
  # there is no error queue forcing a daily cadence. Friday so the week's shipped work is
  # complete and the ammo pack is in hand before the weekend, when Connor actually posts.
  #
  # 13:47 UTC is anchored to EDT (US summer). GitHub cron cannot observe daylight saving, so the
  # LOCAL time drifts an hour across the year — an accepted trade for reliable delivery:
  #   EDT (summer): 09:47 ET
  #   EST (winter): 08:47 ET
  # Minute :47 (not :00) dodges the top-of-the-hour congestion that GitHub drops runs at.
  #
  # The second entry is the REVISION GATE, and it is deliberately not a second
  # thinking pass. When Connor sends a post back from #kipp, the rewrite used to
  # wait for Friday — up to six days for a post going out tomorrow, which is the
  # same as never. This slot runs a curl against one table and, on the ordinary
  # day where nothing was sent back, exits before Claude is ever installed:
  # a minute of Actions time and zero tokens. When something IS waiting it runs
  # revision mode only, on Sonnet, because rewriting a caption against a note is
  # mechanical work and Opus is for the pass that writes PRs.
  #
  # 16:47 UTC — 12:47 ET summer / 11:47 ET winter. After the morning approval
  # message (10:52 UTC) and the post pack (11:12 UTC), so a post sent back over
  # coffee is rewritten and back in the queue the same day.
  schedule:
    - cron: '47 13 * * 5'
    - cron: '47 16 * * *'

  workflow_dispatch:
    inputs:
      run_mode:
        description: "weekly = full pass · seo = technical lane only · ammo = Slack pack only, no PRs · brief = build one approved brief · revision = clear the sent-back queue"
        required: false
        default: 'weekly'
        type: choice
        options: [weekly, seo, ammo, brief, revision]
      brief_id:
        description: "agent_briefs id to build now (from the Slack 'Build this' button). Required when run_mode is brief."
        required: false
        type: string

permissions:
  contents: write         # branches only — the agent never pushes to main
  pull-requests: write

concurrency:
  group: content-ops
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The gate. One HTTP request, no checkout, no Node, no model.
  #
  # It exists so the daily slot costs nothing on the days it has nothing to do.
  # Anything that decides whether to spend a model run has to be cheaper than the
  # run it is deciding about, or it is just a slower way of always running.
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.decide.outputs.run }}
      run_mode: ${{ steps.decide.outputs.run_mode }}
      model: ${{ steps.decide.outputs.model }}
    steps:
      - name: Decide whether this run has work
        id: decide
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Empty on a scheduled run; the literal cron string tells the two slots
          # apart. A manual dispatch has no schedule and falls through to the
          # mode the person picked.
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.run_mode }}
        run: |
          set -euo pipefail

          if [ "$SCHEDULE" = "47 16 * * *" ]; then
            MODE=revision
          else
            MODE="${INPUT_MODE:-weekly}"
          fi

          # Only the revision lane is gated. The Friday pass has standing work by
          # definition — an audit, a changelog, a week to book — and a manual
          # dispatch is a person asking for a run on purpose.
          if [ "$MODE" != "revision" ] || [ -n "${INPUT_MODE:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "run_mode=$MODE" >> "$GITHUB_OUTPUT"
            [ "$MODE" = "revision" ] && echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT" \
                                    || echo "model=claude-opus-5" >> "$GITHUB_OUTPUT"
            echo "Running: $MODE"
            exit 0
          fi

          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '[:space:]')"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice::Database secrets are not set; nothing to gate on. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEAD + count=exact returns the number in Content-Range and no rows.
          # `|| true` on purpose: pipefail would otherwise turn a network blip
          # into a failed job, and a failed gate is a rewrite that never happens.
          # An unreadable answer falls through to the run-anyway branch below.
          RANGE="$(curl -sS -I \
            "$URL/rest/v1/social_posts?select=id&revision_requested_at=not.is.null&status=eq.draft" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Prefer: count=exact" \
            | tr -d '\r' | awk -F'/' '/[Cc]ontent-[Rr]ange/ {print $2}' || true)"
          COUNT="${RANGE:-x}"

          # A failed read is not an empty queue. Run rather than silently skip:
          # the expensive failure here is a rewrite that never happens.
          case "$COUNT" in
            ''|*[!0-9]*) echo "::warning::Could not read the revision queue; running anyway."; COUNT=1 ;;
          esac

          if [ "$COUNT" -eq 0 ]; then
            echo "Nothing was sent back. Skipping before the model is installed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "$COUNT waiting to be rewritten."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "run_mode=revision" >> "$GITHUB_OUTPUT"
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
          fi

  content-ops:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 55 rather than 45 since Phase 0g (the trend read) and a seven day calendar were added.
    # A timeout is the worst outcome available here: the work is done, the PRs may be open, and
    # the run dies before the Slack report and the brain write that would tell anyone about it.
    # The prompt's run-economy rules are what keep the run short; this is only the backstop.
    timeout-minutes: 55

    steps:
      - name: Checkout ABRAM-DOCS
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Built-in GITHUB_TOKEN. Correct for PR-only mode, where a human merges. The agent runs
          # the audit and the build in this runner and records results in the PR body.

      - name: Checkout abram-network (read-only, for the shared employee brain)
        uses: actions/checkout@v5
        with:
          repository: cthomas32/abram-network
          # Fine-grained PAT with `contents: read` on abram-network ONLY. This is Romilly's
          # access shape. KIPP reads .agents/brain/ and `git log origin/main` here and never
          # writes — the prompt forbids it and this token could not push anyway.
          token: ${{ secrets.NETWORK_REPO_READ_PAT }}
          path: abram-network
          # Full history: the agent reads commit subjects since its last run to build the
          # changelog and to detect which shipped changes invalidated which help article.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        # The NAME keeps provenance (PRs and git log still read as the agent). The EMAIL must be
        # the repo owner's, because Vercel's Hobby plan blocks builds for commits authored by an
        # address outside the account — a bot-authored commit silently fails to deploy.
        run: |
          git config --global user.name  "abram-agent-co[bot]"
          git config --global user.email "connorthomas32@gmail.com"

      - name: Run KIPP (agent-co) content-ops pass
        id: contentops
        env:
          # Subscription auth (no metered API key). Generate once with `claude setup-token`
          # (Pro/Max/Team/Enterprise; token lasts ~1 year) and store as CLAUDE_CODE_OAUTH_TOKEN.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # ABRAM-DOCS database — the ONLY Supabase project this repo may target (AGENTS.md).
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # abram-network database — the shared employee brain. The prompt restricts writes to
          # abram_brain_events and agent_briefs; this key is capable of more, so that restriction
          # is a prompt rule, not a credential boundary. Revisit if it ever proves insufficient.
          NETWORK_SUPABASE_URL: ${{ secrets.NETWORK_SUPABASE_URL }}
          NETWORK_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NETWORK_SUPABASE_SERVICE_ROLE_KEY }}

          # Google Search Console. OPTIONAL — scripts/gsc-report.js exits 78 ("not configured")
          # when absent and the prompt treats 78 as a skip, not a failure. Everything else runs.
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}

          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_KIPP || secrets.SLACK_TRIAGE_WEBHOOK_URL }}
          # Passed through to the agent's payload so a channel-overridable (classic) webhook
          # routes here. Harmlessly ignored by a modern app webhook already bound to a channel.
          SLACK_CHANNEL: '#kipp'

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          RUN_MODE: ${{ needs.gate.outputs.run_mode }}
          BRIEF_ID: ${{ github.event.inputs.brief_id }}
          # Opus writes the PRs and the ammo pack. A revision pass rewrites a
          # caption against a note somebody already wrote — mechanical work, and
          # Sonnet does it for roughly half the token cost.
          CLAUDE_MODEL: ${{ needs.gate.outputs.model }}
          # Behaviour-analysis window. The Slack report's "last 28d" wording follows this value
          # automatically — the prompt reads it rather than hardcoding a number.
          LOOKBACK_DAYS: '28'

        run: |
          # Defensive: strip stray whitespace/newlines that secrets pick up when pasted. Tokens
          # and URLs never contain whitespace, and an embedded newline silently breaks every
          # curl and makes the auth header invalid. Done without echoing any value.
          for v in CLAUDE_CODE_OAUTH_TOKEN SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY \
                   NETWORK_SUPABASE_URL NETWORK_SUPABASE_SERVICE_ROLE_KEY \
                   SLACK_WEBHOOK_URL GSC_SITE_URL; do
            export "$v=$(printf '%s' "${!v}" | tr -d '[:space:]')"
          done
          # NOT stripped: GSC_SERVICE_ACCOUNT_JSON is a JSON document whose private_key contains
          # real newlines. Stripping whitespace would corrupt the RSA key and break signing.

          echo "Run mode: $RUN_MODE${BRIEF_ID:+ (brief $BRIEF_ID)}"
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "Search Console: NOT configured — the run continues without search-demand data."
          fi

          # The agent reads the sibling checkout at ../abram-network relative to the repo root.
          # actions/checkout placed it INSIDE the workspace at ./abram-network, so expose it
          # where the prompt expects it. A symlink, not a copy — it must stay read-only.
          ln -sfn "$GITHUB_WORKSPACE/abram-network" "$GITHUB_WORKSPACE/../abram-network"

          # --strict-mcp-config with no --mcp-config loads ZERO MCP servers, so any committed
          # .mcp.json is ignored and no auth prompt clutters the log. The agent reaches both
          # databases with plain curl and the service-role keys instead.
          #
          # It does NOT disable the built-in tools, and Phase 0g depends on that: WebSearch is
          # how KIPP reads what the audience is talking about this week. If web access is ever
          # restricted here, that phase degrades to nothing and the run should say so rather
          # than inventing a trend. Do not add --allowedTools without WebSearch in the list.
          claude -p "$(cat .agents/scheduled-content-ops.prompt.md)" \
            --model "${CLAUDE_MODEL:-claude-opus-5}" \
            --dangerously-skip-permissions \
            --strict-mcp-config

      - name: Slack fallback on failure
        # Only fires if the step above crashed before the agent could post its own report. No
        # duplicate risk: on success the agent posts exactly one message and this is skipped.
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_KIPP || secrets.SLACK_TRIAGE_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          URL="$(printf '%s' "$SLACK_WEBHOOK_URL" | tr -d '[:space:]')"
          [ -z "$URL" ] && { echo "No Slack webhook configured; nothing to notify."; exit 0; }
          curl -s -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":warning: KIPP (content ops) failed before it could report. <$RUN_URL|View run>\"}" \
            > /dev/null
